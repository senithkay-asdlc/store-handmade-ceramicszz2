openapi: 3.0.3
info:
  title: Ceramics API
  version: 0.1.0
  description: Catalog, cart, checkout, and order lifecycle for the single-seller ceramics store.
servers:
  - url: /
tags:
  - name: catalog
  - name: cart
  - name: orders
paths:
  /products:
    get:
      operationId: listProducts
      summary: List available (unsold) products
      tags: [catalog]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Paged list of available products
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProduct
      summary: Get one product's detail
      tags: [catalog]
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /products/{productId}/manage:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: updateProduct
      summary: Update a product listing (Store Owner)
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not the Store Owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removeProduct
      summary: Remove a product listing (Store Owner)
      tags: [catalog]
      responses:
        '204':
          description: Product removed
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not the Store Owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /products/manage:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: createProduct
      summary: Add a new one-of-a-kind product listing (Store Owner)
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not the Store Owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /carts/{cartId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
    get:
      operationId: getCart
      summary: Get a cart and its items
      tags: [cart]
      responses:
        '200':
          description: Cart with line items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: Cart not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /carts/{cartId}/items:
    parameters:
      - $ref: '#/components/parameters/CartId'
    post:
      operationId: addCartItem
      summary: Add a product to the cart
      tags: [cart]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: Product already sold or invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Cart or product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /carts/{cartId}/items/{productId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
      - $ref: '#/components/parameters/ProductId'
    delete:
      operationId: removeCartItem
      summary: Remove a product from the cart
      tags: [cart]
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: Cart or item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listOrders
      summary: List orders (own orders for a Shopper, all orders for the Store Owner)
      tags: [orders]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [new, shipped, delivered] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Paged list of orders
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createOrder
      summary: Place an order from a cart (checkout)
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: Order created and payment charged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Cart empty, item already sold, or payment declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getOrder
      summary: Get one order's detail
      tags: [orders]
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller does not own this order and is not the Store Owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateOrderStatus
      summary: Update an order's fulfillment status (Store Owner)
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [new, shipped, delivered] }
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller is not the Store Owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    CartId:
      name: cartId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
  schemas:
    Product:
      type: object
      required: [id, name, price, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number, format: decimal }
        imageUrl: { type: string }
        status: { type: string, enum: [available, sold] }
    ProductInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number, format: decimal }
        imageUrl: { type: string }
    Cart:
      type: object
      required: [id, items]
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
    CartItem:
      type: object
      required: [productId, name, price]
      properties:
        productId: { type: string }
        name: { type: string }
        price: { type: number, format: decimal }
    OrderInput:
      type: object
      required: [cartId, shippingAddress, paymentToken]
      properties:
        cartId: { type: string }
        shippingAddress: { type: string }
        paymentToken: { type: string, description: tokenized payment detail from the payment provider }
    Order:
      type: object
      required: [id, status, total, createdAt, items]
      properties:
        id: { type: string }
        status: { type: string, enum: [new, shipped, delivered] }
        shippingFee: { type: number, format: decimal }
        total: { type: number, format: decimal }
        shippingAddress: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
    OrderItem:
      type: object
      required: [productId, name, price]
      properties:
        productId: { type: string }
        name: { type: string }
        price: { type: number, format: decimal }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
