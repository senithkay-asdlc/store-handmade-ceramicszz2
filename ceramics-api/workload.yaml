apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: ceramics-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - external

dependencies:
  resources:
    - ref: store-handmade-ce-6088d32e
      envBindings:
        adminPassword: CERAMICS_DB_ADMINPASSWORD
        adminURL: CERAMICS_DB_ADMINURL
        database: CERAMICS_DB_DATABASE
        host: CERAMICS_DB_HOST
        password: CERAMICS_DB_PASSWORD
        port: CERAMICS_DB_PORT
        url: CERAMICS_DB_URL
        username: CERAMICS_DB_USERNAME
    - ref: store-handmade-ce-81a87f04
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
    - ref: store-handmade-ce-9458a9cc
      envBindings:
        STRIPE_API_KEY: STRIPE_API_KEY
    - ref: store-handmade-ce-7cc77d82
      envBindings:
        SENDGRID_API_KEY: SENDGRID_API_KEY
        SENDGRID_FROM_EMAIL: SENDGRID_FROM_EMAIL
